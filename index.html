<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Makes it responsive on phones -->

          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>A Little Confession</title>

    <link rel="stylesheet" href="style.css">
</head>

    <script src="script.js"></script>

</body>
</html>
